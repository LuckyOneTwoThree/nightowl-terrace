<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜猫看台 · Midnight Match 预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#101419; --sc-lowest:#0A0E13; --sc-low:#181C21; --sc:#1C2025; --sc-high:#262A30; --sc-highest:#31353B;
  --on-surface:#E0E2EA; --on-surface-variant:#D6C4AD; --outline:#9F8E79; --outline-variant:#514533;
  --primary:#FFD79E; --primary-c:#FFB224; --on-primary:#442B00; --on-primary-c:#6C4800;
  --secondary:#44E2CD; --tertiary-c:#CEB5FF; --error:#FFB4AB;
  --outline-muted:rgba(159,142,121,.1); --hairline:rgba(159,142,121,.15);
  --fh:"Hanken Grotesk",-apple-system,"PingFang SC",sans-serif;
  --fb:"Be Vietnam Pro",-apple-system,"PingFang SC",sans-serif;
  --fm:"JetBrains Mono","SF Mono",Menlo,monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
body { background:#07090C; min-height:100vh; display:flex; flex-direction:column; align-items:center;
  font-family:var(--fb); color:var(--on-surface); }
.note { color:#6b675f; font-size:11px; padding:14px 16px 6px; text-align:center; font-family:var(--fm); }
.phone { width:390px; height:844px; background:var(--bg); border-radius:40px; border:1px solid #23262E;
  box-shadow:0 24px 80px rgba(0,0,0,.6); overflow:hidden; display:flex; flex-direction:column; margin-bottom:28px; position:relative; }
.screen { flex:1; overflow-y:auto; scrollbar-width:none; }
.screen::-webkit-scrollbar { display:none; }
.tabbar { display:flex; border-top:1px solid var(--outline-muted); background:var(--bg); }
.tabbar .t { flex:1; text-align:center; padding:12px 0 20px; color:var(--outline); font-size:11px; cursor:pointer; user-select:none; }
.tabbar .t.on { color:var(--primary-c); font-weight:700; }
.page { padding-bottom:32px; font-size:14px; line-height:20px; display:none; }
.page.on { display:block; }

.mono { font-family:var(--fm); font-size:12px; line-height:16px; letter-spacing:.5px; font-weight:500; }
.muted { color:var(--on-surface-variant); }
.upper { text-transform:uppercase; letter-spacing:2px; }

.sect { display:flex; align-items:center; gap:8px; margin:24px 16px 12px; }
.sect-title { font-family:var(--fh); font-size:20px; font-weight:600; white-space:nowrap; }
.sect-line { flex:1; height:1px; background:var(--sc-high); }

.card-low { background:var(--sc-low); border:1px solid var(--sc-highest); border-radius:14px; }
.card-highest { background:var(--sc-highest); border:1px solid var(--sc-highest); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.5); }
.glass-panel { background:linear-gradient(135deg,rgba(38,42,48,.8),rgba(24,28,33,.6)); backdrop-filter:blur(10px); border:1px solid var(--outline-muted); }
.text-glow { text-shadow:0 0 8px rgba(255,178,36,.4); }

.lg-chip { display:inline-flex; padding:3px 8px; border-radius:4px; font-family:var(--fm); font-size:12px; line-height:1; color:#fff; }
.chip { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px; font-family:var(--fm); font-size:12px; line-height:1; }
.chip-amber { background:rgba(255,178,36,.1); border:1px solid rgba(255,178,36,.4); color:var(--primary-c); }
.chip-teal { background:rgba(68,226,205,.05); border:1px solid rgba(68,226,205,.4); color:var(--secondary); }
.chip-error { background:rgba(255,180,171,.08); border:1px solid rgba(255,180,171,.4); color:var(--error); }
.chip-solid { background:var(--sc-high); color:var(--primary-c); }

.btn-amber { display:flex; align-items:center; justify-content:center; width:100%; padding:14px 0; border-radius:14px;
  background:var(--primary-c); color:var(--on-primary-c); font-family:var(--fh); font-size:18px; font-weight:700;
  box-shadow:0 0 12px 2px rgba(255,178,36,.15); cursor:pointer; border:none; }
.btn-teal-ghost { display:flex; align-items:center; justify-content:center; padding:8px 0; border-radius:8px;
  background:transparent; box-shadow:inset 0 0 0 1px var(--secondary); color:var(--secondary); font-size:14px; cursor:pointer; }

.circle-xl { width:56px; height:56px; border-radius:999px; background:var(--sc-low); border:1px solid var(--sc-highest);
  display:flex; align-items:center; justify-content:center; font-family:var(--fh); font-size:18px; font-weight:600; }
.circle-md { width:32px; height:32px; border-radius:999px; display:flex; align-items:center; justify-content:center;
  font-family:var(--fm); font-size:10px; border:1px solid; }
.circle-sm { width:20px; height:20px; border-radius:999px; display:flex; align-items:center; justify-content:center;
  font-family:var(--fm); font-size:8px; border:1px solid; }

/* ===== 今日页 ===== */
.topbar { display:flex; justify-content:space-between; align-items:center; padding:14px 16px 10px; }
.tb-left { display:flex; align-items:center; gap:8px; }
.paw { font-size:20px; }
.tb-title { font-family:var(--fh); font-size:20px; font-weight:600; line-height:24px; }
.tb-btn { width:36px; height:36px; border-radius:999px; background:var(--sc-low); display:flex; align-items:center; justify-content:center; font-size:15px; }
.hero { position:relative; margin:8px 16px; padding:16px; overflow:hidden; }
.accent-bar { position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--secondary); }
.hero-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-left:8px; }
.hh-left { display:flex; align-items:center; gap:8px; }
.stars { color:var(--primary-c); font-size:14px; letter-spacing:2px; }
.focal { display:flex; align-items:center; gap:4px; color:var(--secondary); font-family:var(--fm); font-size:12px; }
.dot-teal { width:6px; height:6px; border-radius:999px; background:var(--secondary); animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.vs { display:flex; align-items:center; padding:0 8px 20px; }
.side { width:33%; display:flex; flex-direction:column; align-items:center; gap:8px; }
.side-name { font-size:14px; }
.mid { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.score-m { font-family:var(--fm); font-size:32px; font-weight:700; letter-spacing:-.5px; }
.cd { font-family:var(--fm); font-size:12px; color:var(--primary-c); }
.cd-sub { font-family:var(--fm); font-size:11px; color:var(--on-surface-variant); }
.bullets { background:var(--sc-low); border-radius:8px; padding:12px; margin-bottom:12px; display:flex; flex-direction:column; gap:6px; }
.bullet { display:flex; align-items:center; gap:8px; font-family:var(--fm); font-size:12px; }
.b-dot { width:3px; height:3px; border-radius:999px; background:var(--outline-variant); flex-shrink:0; }
.hero-chips { display:flex; flex-wrap:wrap; gap:8px; }
.quote { display:flex; align-items:center; gap:10px; margin:12px 16px; padding:12px; border-left:2px solid var(--primary-c); }
.quote-text { font-size:13px; font-style:italic; color:var(--on-surface-variant); }
.quote-strong { font-style:normal; font-weight:700; color:var(--on-surface); margin-right:4px; }
.cta { margin:0 16px; }
.extra-grid { display:flex; flex-wrap:wrap; gap:12px; padding:0 16px; }
.extra { width:calc(50% - 6px); padding:12px; }
.extra-head { display:flex; justify-content:space-between; margin-bottom:8px; }
.t-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.t-name { font-size:14px; font-weight:500; }
.dim2 { color:var(--on-surface-variant); }
.extra-foot { margin-top:4px; color:var(--on-surface-variant); font-family:var(--fm); font-size:10px; }
.empty { margin:8px 16px; padding:24px 20px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.empty-title { font-family:var(--fh); font-size:24px; font-weight:700; margin:4px 0; }
.empty-sub { color:var(--on-surface-variant); font-size:14px; margin-bottom:20px; }
.next-box { width:100%; background:rgba(28,32,37,.8); border:1px solid rgba(81,69,51,.3); border-radius:8px; padding:12px; }
.next-label { color:var(--primary); display:block; margin-bottom:4px; font-family:var(--fm); font-size:12px; }
.next-count { display:flex; align-items:baseline; justify-content:center; gap:4px; color:var(--primary-c); font-family:var(--fm); font-size:32px; font-weight:700; }
.next-unit { font-size:12px; opacity:.7; margin-left:4px; }
.next-match { display:flex; justify-content:space-between; margin-top:12px; padding-top:6px; border-top:1px solid rgba(81,69,51,.2); font-size:14px; }
.replay { margin:0 16px 12px; padding:12px; }
.rp-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.rp-chip { padding:2px 8px; font-size:10px; }
.rp-pair { display:block; font-size:16px; font-weight:600; margin:4px 0; }
.rp-teaser { color:var(--on-surface-variant); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tmr { display:flex; align-items:center; margin:0 16px 8px; padding:12px; background:var(--sc-lowest); border:1px solid var(--sc-highest); border-radius:14px; }
.tmr-time { display:flex; flex-direction:column; align-items:center; min-width:50px; }
.tmr-hm { font-family:var(--fh); font-size:20px; font-weight:600; line-height:1; margin-top:4px; }
.tmr-div { width:1px; height:32px; background:var(--sc-highest); margin:0 16px; }
.tmr-teams { flex:1; display:flex; align-items:center; justify-content:space-between; gap:6px; }
.stories { display:flex; gap:12px; overflow-x:auto; padding:0 16px 8px; scrollbar-width:none; }
.stories::-webkit-scrollbar{display:none}
.story { flex-shrink:0; display:flex; flex-direction:column; justify-content:flex-end; gap:4px;
  width:200px; height:128px; padding:12px; border-radius:14px; cursor:pointer; }
.st-ep { color:var(--secondary); font-family:var(--fm); font-size:12px; }
.st-name { font-size:15px; font-weight:700; line-height:20px; }
.st-desc { color:var(--on-surface-variant); font-size:11px; line-height:16px; }

/* ===== 本周页 ===== */
.wk { padding:12px 16px 32px; }
.budget { display:flex; align-items:center; gap:20px; padding:16px; }
.ring { width:100px; height:100px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
.ring-inner { width:75px; height:75px; border-radius:999px; background:var(--sc-low); display:flex; align-items:center; justify-content:center; }
.ring-num { font-family:var(--fm); font-size:16px; font-weight:700; color:var(--primary-c); }
.b-right { flex:1; display:flex; flex-direction:column; gap:6px; }
.b-title { font-family:var(--fh); font-size:16px; font-weight:600; }
.b-nums { display:flex; align-items:baseline; gap:8px; }
.b-num-on { font-family:var(--fm); font-size:22px; font-weight:700; }
.plan { padding:4px 0; }
.plan-row { display:flex; align-items:center; gap:10px; padding:12px; position:relative; overflow:hidden; cursor:pointer; }
.pr-bar { position:absolute; left:0; top:0; bottom:0; width:4px; }
.pr-mid { flex:1; display:flex; flex-direction:column; }
.pr-pair { font-size:15px; font-weight:600; }
.pr-right { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.pr-idx { font-family:var(--fm); font-size:16px; font-weight:700; color:var(--primary); }
.pr-cost { color:var(--on-surface-variant); font-family:var(--fm); font-size:10px; }
.plan-alt { padding:8px 12px 10px; font-family:var(--fm); font-size:11px; color:var(--on-surface-variant); }
.hl-wrap { padding:1px; border-radius:14px; background:linear-gradient(90deg,rgba(255,178,36,.6),rgba(159,142,121,.2)); margin-top:12px; }
.hl-card { background:var(--sc); border-radius:14px; overflow:hidden; }
.hl-head { display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid var(--hairline); }
.hl-label { color:var(--primary); font-family:var(--fm); font-size:12px; }
.hl-body { display:flex; align-items:center; padding:12px; gap:12px; }
.hl-mid { flex:1; display:flex; flex-direction:column; gap:4px; }
.hl-pair { font-family:var(--fh); font-size:20px; font-weight:600; line-height:24px; }
.hl-stats { display:flex; align-items:center; gap:12px; }
.hl-stat { display:flex; flex-direction:column; align-items:center; gap:2px; }
.hl-idx { font-family:var(--fm); font-size:20px; font-weight:700; color:var(--primary-c); }
.hl-cost { font-family:var(--fm); font-size:16px; font-weight:700; }
.hl-div { width:1px; height:28px; background:var(--sc-highest); }
.hl-btn { padding:8px 14px; border-radius:8px; background:var(--primary-c); color:var(--on-primary-c); font-size:13px; font-weight:700; cursor:pointer; }
.mine { padding:12px; margin-bottom:8px; border-color:rgba(255,180,171,.3); cursor:pointer; }
.mine-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.mine-pair { display:block; font-size:15px; font-weight:600; margin:4px 0; }
.mine-reason { color:var(--error); font-size:12px; }
.owl-row { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px; }
.owl-row .mine-pair { flex:1; margin:0; }
.owl-time { color:var(--secondary); font-family:var(--fm); font-size:10px; }

/* ===== 赛程页 ===== */
.dstrip { display:flex; white-space:nowrap; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none; }
.dstrip::-webkit-scrollbar{display:none}
.dchip { flex-shrink:0; display:inline-flex; flex-direction:column; align-items:center; gap:4px; width:64px; padding:8px 0; margin-right:8px;
  border-radius:8px; background:var(--sc-low); border:1px solid var(--sc-highest); cursor:pointer; }
.dchip-wd { font-size:11px; color:var(--on-surface-variant); }
.dchip-md { font-family:var(--fm); font-size:12px; }
.dchip.on { background:var(--primary-c); border-color:transparent; box-shadow:0 0 12px rgba(255,178,36,.2); }
.dchip.on .dchip-wd,.dchip.on .dchip-md { color:var(--on-primary); font-weight:700; }
.pills { display:flex; white-space:nowrap; overflow-x:auto; padding:8px 16px; scrollbar-width:none; }
.pills::-webkit-scrollbar{display:none}
.fpill { flex-shrink:0; display:inline-flex; padding:6px 20px; margin-right:8px; border-radius:999px;
  font-family:var(--fm); font-size:12px; background:var(--sc-high); color:var(--on-surface-variant); border:1px solid var(--hairline); cursor:pointer; }
.fpill.on-ALL { background:var(--primary-c); color:var(--on-primary); font-weight:700; }
.fpill.on-PL { background:#1E1025; color:#D8B4E2; border-color:rgba(216,180,226,.3); }
.fpill.on-PD { background:#2A0E10; color:#FF8E8E; border-color:rgba(255,142,142,.3); }
.fpill.on-SA { background:#0E1A26; color:#8AB4F8; border-color:rgba(138,180,248,.3); }
.fpill.on-BL { background:#26100F; color:#FF8E8E; border-color:rgba(255,142,142,.3); }
.fpill.on-FL { background:#0E241C; color:#6EE7B7; border-color:rgba(110,231,183,.3); }
.fpill.on-SCG { background:#26200A; color:#FDE68A; border-color:rgba(253,230,138,.3); }
.slist { padding:4px 16px 0; }
.group { scroll-margin-top:10px; }
.g-head { display:flex; align-items:baseline; gap:8px; padding:12px 0 8px; }
.g-date { font-family:var(--fh); font-size:17px; font-weight:600; }
.g-line { flex:1; height:1px; background:var(--sc-high); }
.match { position:relative; display:flex; align-items:center; margin-bottom:8px; overflow:hidden; cursor:pointer; }
.m-accent { position:absolute; left:0; top:0; bottom:0; width:4px; }
.m-body { flex:1; padding:10px 12px 10px 16px; }
.m-top { display:flex; justify-content:space-between; margin-bottom:6px; }
.m-right { display:flex; align-items:center; gap:8px; }
.score { font-family:var(--fm); font-size:14px; color:var(--on-surface-variant); width:16px; text-align:center; }
.score.ft { color:var(--on-surface); font-weight:700; }
.m-side { display:flex; flex-direction:column; align-items:center; gap:6px; padding-right:12px; }
.stars-sm { color:var(--primary-c); font-size:10px; letter-spacing:1px; }
.st-btn { color:var(--outline); font-size:16px; cursor:pointer; }
.g-empty { padding:16px; text-align:center; margin-bottom:8px; }
.sfoot { text-align:center; padding:16px 0; font-family:var(--fm); font-size:10px; color:var(--outline-variant); }

/* ===== 玩法页 ===== */
.pg { padding:12px 16px 32px; }
.pg-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.pg-title { font-family:var(--fh); font-size:20px; font-weight:600; }
.pgrid { display:flex; flex-wrap:wrap; gap:12px; }
.pcard { position:relative; overflow:hidden; width:calc(50% - 6px); height:110px; padding:12px;
  background:#161D27; border-radius:14px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  display:flex; flex-direction:column; justify-content:flex-end; gap:2px; cursor:pointer; }
.orb { position:absolute; top:-20px; right:-20px; width:80px; height:80px; border-radius:999px; filter:blur(20px); opacity:.25; }
.c-amber .orb { background:var(--primary-c); } .c-teal .orb { background:var(--secondary); }
.c-red .orb { background:#EF4444; } .c-violet .orb { background:#8B7CF6; }
.p-icon { font-size:22px; margin-bottom:4px; }
.p-name { font-family:var(--fh); font-size:16px; font-weight:700; }
.p-sub { font-family:var(--fm); font-size:10px; color:var(--on-surface-variant); }
.guess { padding:12px; margin-bottom:8px; }
.g-vs { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; }
.g-side { display:flex; flex-direction:column; align-items:center; gap:6px; }
.g-name { font-size:13px; font-weight:500; }
.g-opts { display:flex; gap:8px; }
.g-opt { flex:1; text-align:center; padding:8px 0; border:1px solid var(--hairline); border-radius:8px;
  color:var(--on-surface-variant); font-size:13px; cursor:pointer; }
.g-opt:hover { background:rgba(255,178,36,.1); border-color:rgba(255,178,36,.4); color:var(--primary-c); }
.g-sealed { text-align:center; padding:8px 0; border-radius:8px; background:rgba(255,178,36,.08); color:var(--primary); font-family:var(--fm); font-size:12px; }
.board { padding:24px 16px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.b-emoji { font-size:28px; }
.b-title { font-family:var(--fh); font-size:16px; font-weight:700; }
.b-sub { color:var(--on-surface-variant); font-size:12px; }

/* ===== 我的页 ===== */
.me { padding:16px 16px 32px; }
.head { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.avatar { width:56px; height:56px; border-radius:999px; background:var(--sc-highest); border:1px solid var(--sc-highest);
  display:flex; align-items:center; justify-content:center; font-size:28px; }
.h-col { flex:1; display:flex; flex-direction:column; gap:2px; }
.h-name { font-family:var(--fh); font-size:20px; font-weight:700; }
.h-set { font-size:20px; }
.stats { display:flex; align-items:center; padding:16px; }
.stat { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.s-num { font-family:var(--fm); font-size:20px; font-weight:700; color:var(--primary-c); }
.s-label { color:var(--on-surface-variant); font-family:var(--fm); font-size:10px; }
.s-div { width:1px; height:28px; background:var(--sc-highest); }
.follow { padding:4px 12px 12px; }
.f-group { padding-top:12px; }
.f-lg { display:block; margin-bottom:8px; }
.f-chips { display:flex; flex-wrap:wrap; gap:6px; }
.f-chip { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--hairline); color:var(--on-surface-variant); font-size:12px; cursor:pointer; }
.f-chip.on { background:var(--primary-c); border-color:transparent; color:var(--on-primary); font-weight:700; box-shadow:0 0 8px rgba(255,178,36,.3); }
.f-dot { width:6px; height:6px; border-radius:999px; }
.f-new { font-size:8px; padding:1px 4px; border-radius:4px; background:var(--sc-highest); color:var(--on-surface-variant); }
.f-chip.on .f-new { background:rgba(68,43,0,.2); color:var(--on-primary); }
.menu { padding:0 4px; }
.menu-row { display:flex; align-items:center; justify-content:space-between; padding:16px 12px; border-bottom:1px solid rgba(49,53,59,.5); cursor:pointer; }
.menu-row:last-child { border-bottom:none; }
.m-left { display:flex; align-items:center; gap:10px; font-size:14px; }
.m-arrow { color:var(--outline); font-size:18px; }

.toast { position:absolute; left:50%; bottom:100px; transform:translateX(-50%); background:rgba(28,32,37,.95);

function toast(msg) {

/* ===== 今日 ===== */
function todayHTML() {
  var s = '';
  s += '<div class="topbar"><div class="tb-left"><span class="paw">🐾</span><div style="display:flex;flex-direction:column">' +
       '<span class="mono muted upper">' + VM.dateLabel + '</span><span class="tb-title">今晚哪场值得熬</span></div></div>' +
       '<div class="tb-btn" onclick="switchTab(\'schedule\')">📅</div></div>';

  var hero = VM.hero;
  if (hero && !noBall) {
    s += '<div class="hero card-highest"><div class="accent-bar"></div>';
    s += '<div class="hero-head"><div class="hh-left">' +
         '<span class="lg-chip" style="background:' + hero.solid + '">' + esc(hero.lgZh) + '</span>' +
         '<span class="stars">' + hero.stars + '</span></div>' +
         (hero.focal ? '<div class="focal"><span class="dot-teal"></span>焦点战</div>' : '') + '</div>';
    s += '<div class="vs">' +
         '<div class="side"><div class="circle-xl">' + hero.h.id + '</div><span class="side-name">' + hero.h.zh + '</span></div>' +
         '<div class="mid"><div class="score-m">' + hero.hm + '</div><div class="cd text-glow" id="cd">--</div>' +
         '<div class="cd-sub">' + hero.dayLabel + ' · ' + hero.md + '</div></div>' +
         '<div class="side"><div class="circle-xl">' + hero.a.id + '</div><span class="side-name">' + hero.a.zh + '</span></div></div>';
    if (hero.points.length) {
      s += '<div class="bullets">';
      hero.points.forEach(function (p) { s += '<div class="bullet"><span class="b-dot"></span>' + esc(p) + '</div>'; });
      s += '</div>';
    }
    s += '<div class="hero-chips"><span class="chip chip-amber">夜猫指数 ' + hero.indexText + '</span>';
    hero.storyNames.forEach(function (n) { s += '<span class="chip chip-teal">' + esc(n) + '</span>'; });
    s += '<span class="chip" style="background:var(--sc-high);color:var(--on-surface-variant)">' + hero.tier + ' · 睡眠成本 ' + hero.cost + 'h</span></div>';
    s += '</div>';

    s += '<div class="quote card-low"><span>🐾</span><span class="quote-text"><span class="quote-strong">夜猫絮语:</span>“' + esc(VM.quip) + '”</span></div>';
    s += '<button class="btn-amber cta" onclick="toast(\'海报导出 v1 上线\')">生成观赛海报</button>';

    if (VM.extras.length) {
      s += '<div class="sect"><span class="sect-title">今日加餐</span><div class="sect-line"></div></div><div class="extra-grid">';
      VM.extras.forEach(function (e) {
        s += '<div class="extra card-low"><div class="extra-head"><span class="mono muted">' + esc(e.lgZh) + '</span><span class="mono">' + e.hm + '</span></div>' +
             '<div class="t-row"><span class="t-name">' + e.h.zh + '</span><span class="circle-sm" style="background:' + e.h.bg + ';border-color:' + e.h.bd + '">' + e.h.id + '</span></div>' +
             '<div class="t-row"><span class="t-name dim2">' + e.a.zh + '</span><span class="circle-sm" style="background:' + e.a.bg + ';border-color:' + e.a.bd + '">' + e.a.id + '</span></div>' +
             '<div class="extra-foot">★' + e.star + ' · 指数 ' + e.indexText + '</div></div>';
      });
      s += '</div>';
    }
  } else {
    var nf = VM.nextFocal;
    s += '<div class="empty card-highest"><span class="mono muted upper" style="letter-spacing:4px">长草期 · 养肝周</span>' +
         '<div class="empty-title">今夜无球</div><div class="empty-sub">夜猫也需要补觉，养精蓄锐。</div>';
    if (nf) {
      s += '<div class="next-box"><span class="next-label">距下一场焦点战</span>' +
           '<div class="next-count text-glow">' + nf.cdD + '<span class="next-unit">天</span>' + nf.cdH + '<span class="next-unit">小时</span></div>' +
           '<div class="next-match"><span>' + nf.h.zh + ' vs ' + nf.a.zh + '</span><span class="mono muted">' + nf.wd + ' ' + nf.hm + '</span></div></div>';
    }
    s += '</div>';
    s += '<div class="sect"><span class="sect-title">补番推荐</span><div class="sect-line"></div></div>';
    VM.replays.forEach(function (r) {
      s += '<div class="replay card-low"><div class="rp-head"><span class="mono muted">' + esc(r.lgZh) + '</span><span class="chip chip-teal rp-chip">剧透已屏蔽</span></div>' +
           '<span class="rp-pair">' + esc(r.pair) + '</span><span class="rp-teaser">' + esc(r.teaser) + '</span></div>';
    });
  }

  if (VM.tomorrow.length) {
    s += '<div class="sect"><span class="sect-title">明日预告</span><div class="sect-line"></div></div>';
    VM.tomorrow.forEach(function (e) {
      s += '<div class="tmr"><div class="tmr-time"><span class="mono muted">' + e.wd + '</span><span class="tmr-hm">' + e.hm + '</span></div><div class="tmr-div"></div>' +
           '<div class="tmr-teams"><span class="t-name">' + e.h.zh + '</span>' +
           '<span class="circle-sm" style="background:' + e.h.bg + ';border-color:' + e.h.bd + '">' + e.h.id + '</span>' +
           '<span class="mono muted">vs</span>' +
           '<span class="circle-sm" style="background:' + e.a.bg + ';border-color:' + e.a.bd + '">' + e.a.id + '</span>' +
           '<span class="t-name">' + e.a.zh + '</span></div></div>';
    });
  }

  s += '<div class="sect"><span class="sect-title">正在追的剧</span><div class="sect-line"></div><span class="mono muted">全部 ›</span></div><div class="stories">';
  VM.stories.forEach(function (st) {
    s += '<div class="story glass-panel" onclick="toast(\'故事线时间轴 v1 上线\')"><span class="st-ep">' + st.ep + '</span>' +
         '<div class="st-name">' + st.typeZh + ' · ' + esc(st.name) + '</div><div class="st-desc">' + esc(st.desc) + '</div></div>';
  });
  s += '</div>';
  s += '<div style="text-align:center;margin:16px 0"><span class="chip" style="background:var(--sc-high);color:var(--on-surface-variant);cursor:pointer" onclick="noBall=!noBall;render()">' + (noBall ? '← 回有球日' : '切换无球日预览') + '</span></div>';
  return s;
}

/* ===== 本周 ===== */
function weekHTML() {
  var w = VM.week;
  var s = '<div class="wk">';
  s += '<div class="budget card-low"><div class="ring" style="background:conic-gradient(#FFB224 0% ' + w.pct + '%,#31353B ' + w.pct + '% 100%)">' +
       '<div class="ring-inner"><span class="ring-num">' + w.used + 'h</span></div></div>' +
       '<div class="b-right"><span class="b-title">夜猫指数 · 本周预算</span>' +
       '<div class="b-nums"><span class="b-num-on">' + w.used + 'h</span><span class="mono muted">已计划 / ' + w.budget + 'h 额度</span></div>' +
       '<div class="btn-teal-ghost" onclick="toast(\'额度调整 v1 上线\')">调整额度</div></div></div>';

  s += '<div class="sect"><span class="sect-title">最优组合</span><div class="sect-line"></div></div>';
  s += '<div class="plan card-low">';
  w.best.forEach(function (e) {
    s += '<div class="plan-row" onclick="switchTab(\'schedule\')"><div class="pr-bar" style="background:' + e.accent + '"></div>' +
         '<div class="circle-sm" style="background:var(--sc-highest);border-color:var(--sc-highest)">' + e.homeCode + '</div>' +
         '<div class="pr-mid"><span class="pr-pair">' + esc(e.pair) + '</span><span class="mono muted">' + e.md + ' ' + e.wd + ' ' + e.hm + '</span></div>' +
         '<div class="pr-right"><span class="pr-idx">' + e.indexText + '</span><span class="pr-cost">' + e.costText + '</span></div></div>';
  });
  if (w.altCount) s += '<div class="plan-alt">备选：' + w.altCount + ' 场未入组合（超额度）</div>';
  s += '</div>';

  if (w.highlight) {
    var hl = w.highlight;
    s += '<div class="hl-wrap"><div class="hl-card"><div class="hl-head">🔥<span class="hl-label">若只熬一场，选这场</span></div>' +
         '<div class="hl-body"><div class="hl-mid"><span class="hl-pair">' + esc(hl.pair) + '</span>' +
         '<span class="mono muted">' + esc(hl.lgZh) + ' · ' + hl.md + ' ' + hl.wd + ' ' + hl.hm + '</span></div>' +
         '<div class="hl-stats"><div class="hl-stat"><span class="mono muted">爆表指数</span><span class="hl-idx text-glow">' + hl.indexText + '</span></div>' +
         '<div class="hl-div"></div><div class="hl-stat"><span class="mono muted">需耗时</span><span class="hl-cost">' + hl.costText + '</span></div>' +
         '<div class="hl-btn" onclick="toast(\'订阅提醒 v1 上线\')">设提醒</div></div></div></div></div>';
  }

  s += '<div class="sect"><span class="sect-title">雷区预警</span><div class="sect-line"></div></div>';
  if (w.mines.length) {
    w.mines.forEach(function (e) {
      s += '<div class="mine card-low"><div class="mine-head"><span class="chip chip-error">建议睡觉</span><span class="mono muted">' + e.md + ' ' + e.hm + '</span></div>' +
           '<span class="mine-pair">' + esc(e.pair) + '</span><span class="mine-reason">' + esc(e.reason) + '</span></div>';
    });
  } else {
    s += '<div class="card-low" style="padding:16px;text-align:center"><span class="mono muted">本周暂无雷区——好日子。</span></div>';
  }

  s += '<div class="sect"><span class="sect-title">修仙场</span><div class="sect-line"></div></div>';
  w.nightOwls.forEach(function (e) {
    s += '<div class="owl-row card-low"><span class="chip chip-teal">' + e.tier + '</span><span class="mine-pair">' + esc(e.pair) + '</span>' +
         '<span class="owl-time">' + e.md + ' ' + e.hm + ' · ' + e.costText + '</span></div>';
  });
  s += '</div>';
  return s;
}

    s += '</div>';
  });
  s += '<div class="sfoot">— 种子数据：揭幕周 · 全量赛程随 T3 接入 —</div></div>';
  return s;
}
function pickDay(d) {
  selDay = d; render();
  var el = document.getElementById('d-' + d);
  if (el) $('#screen').scrollTop = el.offsetTop - 60;
}

/* ===== 玩法 ===== */
function playHTML() {
  var s = '<div class="pg">';
  s += '<div class="pg-top"><span class="pg-title">互动玩法</span><span class="chip chip-solid">🏆 赛季积分 0</span></div>';
  s += '<div class="pgrid">';
  VM.plays.forEach(function (p) {
    s += '<div class="pcard ' + p.cls + '" onclick="' + (p.id === 'guess' ? "document.getElementById('guess-form').scrollIntoView({behavior:'smooth'})" : "toast(\'云版本上线\')") + '">' +
         '<div class="orb"></div><div class="p-icon">' + p.icon + '</div><div class="p-name">' + p.name + '</div><div class="p-sub">' + esc(p.sub) + '</div></div>';
  });
  s += '</div>';

  s += '<div class="sect"><span class="sect-title">本周竞猜单</span><div class="sect-line"></div></div>';
  VM.guesses.forEach(function (g) {
    s += '<div class="guess card-low" id="guess-form"><span class="mono muted">' + esc(g.label) + '</span>' +
         '<div class="g-vs"><div class="g-side"><span class="circle-md" style="background:' + g.h.bg + ';border-color:' + g.h.bd + '">' + g.h.id + '</span><span class="g-name">' + g.h.zh + '</span></div>' +
         '<span class="mono muted">VS</span>' +
         '<div class="g-side"><span class="circle-md" style="background:' + g.a.bg + ';border-color:' + g.a.bd + '">' + g.a.id + '</span><span class="g-name">' + g.a.zh + '</span></div></div>';
    if (preds[g.id]) {
      s += '<div class="g-sealed">🔒 已封存 · 周五 24:00 开箱</div>';
    } else {
      s += '<div class="g-opts">' +
           '<span class="g-opt" onclick="pick(\'' + g.id + '\',\'h\')">主胜</span>' +
           '<span class="g-opt" onclick="pick(\'' + g.id + '\',\'d\')">平局</span>' +
           '<span class="g-opt" onclick="pick(\'' + g.id + '\',\'a\')">客胜</span></div>';
    }
    s += '</div>';
  });

  s += '<div class="sect"><span class="sect-title">本周排行榜</span><div class="sect-line"></div></div>';
  s += '<div class="board card-low"><div class="b-emoji">🦉</div><div class="b-title">夜猫榜虚位以待</div><div class="b-sub">云版本上线后，群友熬夜时长实时排名</div></div>';
  s += '</div>';
  return s;
}
function pick(id, key) {
  preds[id] = { pick: key, ts: Date.now() };
  render();
  toast('已封存 · 周五 24:00 开箱');
}

/* ===== 我的 ===== */
function meHTML() {
  var predCount = Object.keys(preds).length;
  var s = '<div class="me">';
  s += '<div class="head"><div class="avatar">🦉</div><div class="h-col"><div class="h-name">' + nickname + '</div>' +
       '<span class="mono muted">看台第 1 排 · 本季追剧中</span></div><span class="h-set">⚙️</span></div>';
  s += '<div class="stats card-low"><div class="stat"><span class="s-num">0h</span><span class="s-label">熬夜时长</span></div><div class="s-div"></div>' +
       '<div class="stat"><span class="s-num">' + predCount + '</span><span class="s-label">预测</span></div><div class="s-div"></div>' +
       '<div class="stat"><span class="s-num">—</span><span class="s-label">应验率</span></div></div>';

  s += '<div class="sect"><span class="sect-title">关注球队</span><div class="sect-line"></div></div><div class="follow card-low">';
  VM.meGroups.forEach(function (g) {
    s += '<div class="f-group"><span class="mono muted f-lg">' + g.zh + '</span><div class="f-chips">';
    g.teams.forEach(function (t) {
      var on = followed.indexOf(t.id) >= 0;
      s += '<span class="f-chip ' + (on ? 'on' : '') + '" onclick="toggleTeam(\'' + t.id + '\')">' +
           '<span class="f-dot" style="background:' + t.dot + '"></span>' + t.zh + (t.isNew ? '<span class="f-new">新</span>' : '') + '</span>';
    });
    s += '</div></div>';
  });
  s += '</div>';

  s += '<div class="sect"><span class="sect-title">我的记录</span><div class="sect-line"></div></div><div class="menu card-low">';
  [['🎯','我的预测'],['⚖️','狂言存档'],['🌙','打卡记录'],['🔔','订阅提醒'],['⚙️','设置']].forEach(function (m) {
    s += '<div class="menu-row" onclick="toast(\'云版本上线\')"><div class="m-left"><span>' + m[0] + '</span>' + m[1] + '</div><span class="m-arrow">›</span></div>';
  });
  s += '</div><span class="ver">夜猫看台 · v0.1 体验版</span></div>';
  return s;
}
function toggleTeam(id) {
  var i = followed.indexOf(id);
  if (i >= 0) followed.splice(i, 1); else followed.push(id);
  render();
}

/* ===== 渲染 ===== */
function render() {
  var tabs = [['today', '今日'], ['week', '本周'], ['schedule', '赛程'], ['play', '玩法'], ['me', '我的']];
  $('#tabbar').innerHTML = tabs.map(function (t) {
    return '<div class="t ' + (tab === t[0] ? 'on' : '') + '" onclick="switchTab(\'' + t[0] + '\')">' + t[1] + '</div>';
  }).join('');

  var s = '';
  if (tab === 'today') s = todayHTML();
  else if (tab === 'week') s = weekHTML();
  else if (tab === 'schedule') s = scheduleHTML();
  else if (tab === 'play') s = playHTML();
  else s = meHTML();
  $('#screen').innerHTML = '<div class="page on">' + s + '</div>';
}

function tick() {
  var el = document.getElementById('cd');
  if (!el || !VM.hero || noBall) return;
  var diff = Math.max(0, VM.heroTs - Date.now());
  var h = Math.floor(diff / 3600000), m = Math.floor(diff % 3600000 / 60000), sec = Math.floor(diff % 60000 / 1000);
  var d = Math.floor(h / 24); h = h % 24;
  el.textContent = '距开球 ' + (d > 0 ? d + '天' + h + '小时' : (h > 0 ? h + '小时' + m + '分' : m + '分' + sec + '秒'));
}

render();
setInterval(tick, 1000);
</script>
</body>
</html>
