<style>
        .floodlight-glow {
            box-shadow: 0 0 20px rgba(255, 215, 158, 0.15);
        }

            text-shadow: 0 0 10px rgba(255, 215, 158, 0.3);
        }
        .glass-panel {
            background: linear-gradient(180deg, rgba(49, 53, 59, 0.4) 0%, rgba(24, 28, 33, 0.8) 100%);

            border: 1px solid rgba(159, 142, 121, 0.1);
        }
        
        /* Flip Animation */
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {

        }

</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-on-surface">盲盒开球</h1>
