<script>
        // Simple toggle logic for custom styling if needed, though pure CSS handles the visual state well here.
        document.querySelectorAll('.toggle-checkbox').forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                const label = e.target.nextElementSibling;
                if(e.target.checked) {
                    label.style.backgroundColor = '#ffb224'; // primary-container
                    e.target.style.borderColor = '#ffb224';
                } else {
                    label.style.backgroundColor = '#1c2025'; // surface-container
                    e.target.style.borderColor = '#1c2025';
                }
            });
            
            // Init state
            const label = toggle.nextElementSibling;
            if(toggle.checked) {
                label.style.backgroundColor = '#ffb224';
                toggle.style.borderColor = '#ffb224';
            }
        });
    </script>
