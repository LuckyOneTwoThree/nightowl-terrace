        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }

        .floodlight-glow { box-shadow: 0 0 20px rgba(255, 215, 158, 0.15); }

<body class="antialiased min-h-screen flex flex-col mx-auto w-full max-w-[512px] pb-[88px]">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-surface-container-highest/80 dark:bg-surface-container-highest/80 backdrop-blur-xl shadow-lg shadow-black/50">
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-on-surface">我的预测</h1>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-padding py-section-margin flex flex-col gap-section-margin">
<!-- Empty State (Hidden initially, toggled via JS for demo if needed, but showing populated list first per instructions usually, let's show populated for high-end UI, and maybe an empty state section at the bottom to satisfy requirements, or just the list) -->
<!-- I will build the list as requested, and include the empty state visually hidden or at the end -->
<!-- Date Group 1 -->
<section class="flex flex-col gap-card-gap">
<h2 class="font-data-label text-data-label text-on-surface-variant uppercase tracking-wider">10月24日 星期二</h2>
<!-- Prediction Row (Win) -->
<div class="glass-panel rounded-lg p-container-padding flex items-center justify-between">
<div class="flex flex-col gap-stack-tight">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-secondary text-[20px]">sports_soccer</span>
<span class="font-body-lg text-body-lg text-on-surface">曼联 vs 拜仁慕尼黑</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">预测: 拜仁 胜 (2-1)</span>
</div>
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-secondary text-[24px]">check_circle</span>
<span class="font-score-display text-[24px] text-primary text-glow">+3</span>
</div>
</div>
<!-- Prediction Row (Loss) -->
<div class="glass-panel rounded-lg p-container-padding flex items-center justify-between">
<div class="flex flex-col gap-stack-tight">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">sports_soccer</span>
<span class="font-body-lg text-body-lg text-on-surface">阿森纳 vs 塞维利亚</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">预测: 平局 (1-1)</span>
</div>
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-error text-[24px]">cancel</span>
<span class="font-score-display text-[24px] text-on-surface-variant">0</span>
</div>
</div>
<!-- Boast Row (Success) -->
<div class="bg-surface-container-low border border-surface-variant rounded-lg p-container-padding flex items-start gap-container-padding relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-secondary"></div>
<div class="flex-1 flex flex-col gap-base">
<p class="font-body-sm text-body-sm text-on-surface italic">"我就说哈兰德今晚必进两球，曼城稳稳拿下！"</p>
</div>
<div class="chip-secondary rounded-full px-3 py-1 flex items-center justify-center whitespace-nowrap">
<span class="font-data-label text-data-label text-secondary">应验</span>
</div>
</div>
</section>
<!-- Date Group 2 -->
<section class="flex flex-col gap-card-gap">
<h2 class="font-data-label text-data-label text-on-surface-variant uppercase tracking-wider">10月20日 星期五</h2>
<!-- Boast Row (Fail) -->
<div class="bg-surface-container-low border border-surface-variant rounded-lg p-container-padding flex items-start gap-container-padding relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-error"></div>
<div class="flex-1 flex flex-col gap-base">
<p class="font-body-sm text-body-sm text-on-surface italic">"切尔西这状态，打个保级队还不是手到擒来？"</p>
</div>
<div class="chip-error rounded-full px-3 py-1 flex items-center justify-center whitespace-nowrap">
<span class="font-data-label text-data-label text-error">翻车</span>
</div>
</div>
<!-- Check-in Row -->
<div class="glass-panel rounded-lg p-container-padding flex items-center justify-between">
<div class="flex flex-col gap-stack-tight">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-tertiary-container text-[20px]">schedule</span>
<span class="font-body-lg text-body-lg text-on-surface">皇马 vs 巴萨</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">夜猫打卡</span>
</div>
<div class="bg-surface-container-high rounded px-2 py-1 border border-outline-variant">
<span class="font-data-label text-data-label text-tertiary-container">120 min</span>
</div>
</div>
</section>
<!-- Empty State (Demonstration) -->
<section class="mt-section-margin flex flex-col items-center justify-center text-center py-section-margin glass-panel rounded-xl">
<div class="w-32 h-32 mb-card-gap rounded-full overflow-hidden bg-surface-container flex items-center justify-center">

</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-stack-tight">还没有记录，今晚开始？</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-section-margin px-container-padding">你的午夜传奇还是一张白纸，去看看今晚有什么焦点战吧。</p>
<button class="bg-primary text-on-primary font-headline-md text-headline-md rounded-xl py-3 px-8 floodlight-glow hover:bg-primary-fixed transition-colors active:scale-95 shadow-lg flex items-center gap-base">
                去看看今晚
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-container-padding py-4 bg-surface-container-lowest/80 dark:bg-surface-container-lowest/80 backdrop-blur-xl shadow-lg shadow-black/50 md:hidden border-t-0">

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">sports_soccer</span>
</button>

</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary transition-colors">
